name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Prisma validate
        run: npx prisma validate

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Deploy via rsync to VPS
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          eval $(ssh-agent -s)
          echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan -H 207.244.224.57 >> ~/.ssh/known_hosts
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='*.log' \
            --exclude='scripts/*.sh' \
            ./ root@207.244.224.57:/opt/mainstreet-shield/

      - name: Restart MainStreet Shield app on VPS
        run: |
          eval $(ssh-agent -s)
          echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          ssh -o StrictHostKeyChecking=no root@207.244.224.57 '
            set -e
            mkdir -p /opt/mainstreet-shield
            cd /opt/mainstreet-shield
            # Install dependencies on VPS (include devDeps for tailwindcss build)
            npm ci
            # Load environment variables for prisma generate + build
            export $(cat .env | xargs)
            # Build Next.js app for production
            npx prisma generate
            npm run build
            # Restart the app (systemd)
            if systemctl list-unit-files | grep -q mainstreet-shield.service; then
              systemctl restart mainstreet-shield.service
            else
              echo "No systemd service for mainstreet-shield.service — app will be started manually"
            fi
          '
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}